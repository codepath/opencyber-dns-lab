# dnsmasq.lab.conf — the lab's DNS resolver.
#
# This is the configuration file for the resolver running inside your container.
# In Part 1 you query it with `dig @localhost` to do recon on a fictional target.
# In Part 2 you EDIT this file to poison a record, then reload the resolver.
#
# Whoever controls this file controls the answers every client in the container
# receives. That is the whole point of the lab.

# --- Resolver behaviour -------------------------------------------------------
port=53
listen-address=127.0.0.1
bind-interfaces
user=student              # bind 53 as root, then drop to student so the runtime query log (read in Part 2, Step 4) is student-readable
no-resolv                 # do not inherit upstream servers from /etc/resolv.conf
no-hosts                  # ignore /etc/hosts — all answers come from THIS file
# Upstream forwarding is intentionally OFF: this resolver answers ONLY the lab's
# own names, so real external domains do not resolve. That keeps the container a
# genuinely closed lab (matches Part 0's "everything runs locally") without needing
# --network none, which would break the optional localhost:8088 browser preview.
# To re-enable forwarding you would add:  server=1.1.1.1
log-queries               # log every query (live log, separate from the Part 3 dataset)
log-facility=/opt/dns-lab/dnsmasq-runtime.log

# --- The fictional target: Northwind Bank -------------------------------------
# A record: the "real" login server. This is a TEST-NET-3 address (RFC 5737,
# reserved for documentation) — it is not reachable from the lab, which is fine:
# the attack does not need the real server to exist.
host-record=login.northwind-bank.test,203.0.113.10

# CNAME clue: the public "secure" alias is just an alias for the login host.
# Recon tells you the two names share infrastructure.
cname=secure.northwind-bank.test,login.northwind-bank.test

# TXT clue: an internal operations note that should NEVER have been left public.
# TXT records are free-form text — admins leak all sorts of things here.
txt-record=login.northwind-bank.test,"northwind-ops: whoever answers on :53 IS the source of truth - lock down the resolver before launch"

# MX record (extra recon realism): where mail for the domain goes.
mx-host=northwind-bank.test,mail.northwind-bank.test,10
host-record=mail.northwind-bank.test,203.0.113.25

# Wildcard record: this domain and everything under it resolve to one address
# (a documentation IP, RFC 5737). One of several records the lab resolver serves.
address=/cdn-telemetry.test/198.51.100.13

# ==============================================================================
# PART 2 — POISON THE RESOLVER
#
# Goal: make login.northwind-bank.test resolve to THIS container (127.0.0.1),
# where your lookalike login page is being served on port 8080.
#
# 1. Comment out the real login host-record above (put a # in front of it).
# 2. Uncomment the poisoned line below (remove the leading #).
# 3. Save the file, then run:  reload-resolver
#
#host-record=login.northwind-bank.test,127.0.0.1
# ==============================================================================
